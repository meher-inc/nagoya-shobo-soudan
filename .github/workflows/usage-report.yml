# 政令市版の相談件数（直近30日の質問数と利用者数）を毎週数え、Issue「相談件数レポート」にコメントする。
# 判定（2026-12-21）：公開済みの都市（京都・東京・名古屋・札幌・大阪・福岡）の合計が月300件に届いたら、残りの都市を公開する。
# 試験分（?test=1 の端末・管理者のアカウント）は除き、流入元別にも分ける。全国版は判定とは別に数える。
# 秘密値 CLOUDFLARE_API_TOKEN（D1 の読み取り権限）と CLOUDFLARE_ACCOUNT_ID が必要。
name: 相談件数レポート

on:
  schedule:
    - cron: "0 0 * * 1" # 毎週月曜 9:00（日本時間）
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: 件数を数える
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN が未設定のため数えられません"
            echo "CLOUDFLARE_API_TOKEN が未設定のため数えられません" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # 試験分（users.is_test）を除き、流入元（users.source）別にも数える。scripts/usage-report.mjs
          node scripts/usage-report.mjs > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Issue に記録する
        run: |
          num=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "相談件数レポート in:title" --json number --jq '.[0].number')
          if [ -z "$num" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "相談件数レポート" --body-file report.md
          else
            gh issue comment "$num" --repo "$GITHUB_REPOSITORY" --body-file report.md
          fi
